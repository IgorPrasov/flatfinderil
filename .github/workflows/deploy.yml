name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  build-deploy-miniapp:
    name: Deploy Mini App (Telegram)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build miniapp (Telegram — base /)
        run: pnpm --filter miniapp build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy miniapp to Cloudflare Pages
        run: pnpm dlx wrangler pages deploy apps/miniapp/dist --project-name=flatfinderil-miniapp --branch=main --commit-dirty=true

  build-deploy-web:
    name: Deploy Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build miniapp for web embedding (base /app/)
        run: pnpm --filter miniapp build:web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Copy miniapp build to web/app/
        run: |
          rm -rf apps/web/app
          cp -r apps/miniapp/dist apps/web/app

      - name: Deploy website to Cloudflare Pages
        run: pnpm dlx wrangler pages deploy apps/web --project-name=flatfinderil-preview --branch=main --commit-dirty=true
