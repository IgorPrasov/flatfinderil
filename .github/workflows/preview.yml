name: Preview

on:
  pull_request:
    branches: [main]

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build miniapp for web embedding
        run: pnpm --filter miniapp build:web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Copy miniapp build to web/app/
        run: |
          rm -rf apps/web/app
          cp -r apps/miniapp/dist apps/web/app

      - name: Deploy preview to Cloudflare Pages
        id: cf-deploy
        run: |
          OUTPUT=$(pnpm dlx wrangler pages deploy apps/web \
            --project-name=flatfinderil-preview \
            --branch=pr-${{ github.event.pull_request.number }} \
            --commit-dirty=true 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+\.pages\.dev' | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.cf-deploy.outputs.url }}'
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Preview deployed\n\n**URL:** ${url}\n\n| App | Link |\n|-----|------|\n| Website | ${url} |\n| Mini App | ${url}/app/ |`
            })
